name: Database Maintenance

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      check:
        description: 'Run health checks'
        required: false
        type: boolean
        default: true
      repair:
        description: 'Repair inconsistencies'
        required: false
        type: boolean
        default: true
      completeness:
        description: 'Show completeness analysis'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run (no actual repairs)'
        required: false
        type: boolean
        default: false

  # Weekly scheduled run
  schedule:
    - cron: '0 3 * * 0'  # 3 AM UTC every Sunday

env:
  PYTHON_VERSION: '3.11'

jobs:
  maintenance:
    runs-on: ubuntu-latest

    # Prevent concurrent runs to avoid database conflicts
    concurrency:
      group: db-maintenance
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database maintenance
        id: maintenance
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          cd scripts

          # Build command
          CMD="python db_maintenance.py"

          # Add flags based on inputs (default all true for scheduled runs)
          if [ "${{ github.event_name }}" == "schedule" ]; then
            CMD="$CMD --all"
          else
            if [ "${{ github.event.inputs.check }}" == "true" ]; then
              CMD="$CMD --check"
            fi
            if [ "${{ github.event.inputs.repair }}" == "true" ]; then
              CMD="$CMD --repair"
            fi
            if [ "${{ github.event.inputs.completeness }}" == "true" ]; then
              CMD="$CMD --completeness"
            fi
            if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
              CMD="$CMD --dry-run"
            fi
          fi

          echo "Running: $CMD"
          eval $CMD 2>&1 | tee maintenance_output.txt

          # Also generate JSON for summary
          python db_maintenance.py --all --json > maintenance_report.json 2>/dev/null || true

      - name: Generate summary report
        if: always()
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          cd scripts

          echo "## Database Maintenance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "**Mode:** Dry Run (no changes made)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Health checks section
          echo "### Health Checks" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 100 "HEALTH CHECKS" maintenance_output.txt | grep -B 100 -m 1 "REPAIR\|COMPLETENESS\|DATABASE SUMMARY" | head -n -1 >> $GITHUB_STEP_SUMMARY || echo "No health check output"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Repairs section
          echo "### Repairs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 100 "REPAIR OPERATIONS" maintenance_output.txt | grep -B 100 -m 1 "DATABASE SUMMARY\|CHANNEL COMPLETENESS" | head -n -1 >> $GITHUB_STEP_SUMMARY || echo "No repair output"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Completeness section
          echo "### Channel Completeness" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 100 "CHANNEL COMPLETENESS" maintenance_output.txt >> $GITHUB_STEP_SUMMARY || echo "No completeness output"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report-${{ github.run_number }}
          path: |
            scripts/maintenance_output.txt
            scripts/maintenance_report.json
          retention-days: 90
